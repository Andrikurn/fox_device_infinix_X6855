name: Nightly Build

on:
  push:
    branches: [ never-auto ]   # nonaktifkan auto-trigger dari push biasa
  workflow_dispatch:            # tetap bisa di-trigger manual kapan perlu

env:
  SYNC_URL: 'https://gitlab.com/OrangeFox/sync.git'
  MANIFEST_BRANCH: '14.1'
  DEVICE_PATH: 'device/infinix/X6855'
  DEVICE_BRANCH: 'fox_14.1'
  DEVICE_NAME: 'X6855'
  MAKEFILE_NAME: 'fox_X6855'
  BUILD_TARGET: 'vendorboot'

jobs:
  build:
    name: Build OrangeFox
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      USE_CCACHE: '1'
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}/workspace
      CCACHE_MAXSIZE: 5G
      CCACHE_COMPRESS: '1'
      CCACHE_COMPRESSLEVEL: '6'
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
    steps:

    - name: Check Out
      uses: actions/checkout@v4

    - name: Cleanup
      uses: rokibhasansagar/slimhub_actions@main

    - name: Initialize workspace
      run: |
        mkdir workspace
        cd workspace
        echo "workspace-folder=$(pwd)" >> $GITHUB_OUTPUT
      id: pwd

    - name: Prepare the build environment
      run: |
        sudo apt update && sudo apt upgrade -y
        DEBIAN_FRONTEND=noninteractive sudo apt install -yq \
            linux-modules-extra-azure \
            git python3 tar aria2 patch ccache
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts
        sudo bash setup/android_build_env.sh
        sed -i 's/cd -/cd ../g' setup/install_android_sdk.sh
        sudo bash setup/install_android_sdk.sh
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Install OpenJDK
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'

    - name: Sync OrangeFox sources and minimal manifest
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}
        git clone ${{ env.SYNC_URL }}
        cd sync
        ./orangefox_sync.sh --branch ${{ env.MANIFEST_BRANCH }} --path ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Clone device tree
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        git clone https://github.com/${{ github.repository }} -b ${{ env.DEVICE_BRANCH }} ./${{ env.DEVICE_PATH }}
        git -C ./${{ env.DEVICE_PATH }} checkout ${{ github.sha }}
        # Offline tooling is not part of the build tree.
        rm -rf ./${{ env.DEVICE_PATH }}/.github ./${{ env.DEVICE_PATH }}/tools
        test -d ./${{ env.DEVICE_PATH }}/prebuilt/modules || { echo "::error::prebuilt/modules missing"; exit 1; }
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Set Swap Space
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Prepare Ccache
      id: ccache-prep
      run: |
        set -e
        test -x "$CCACHE_EXEC" || { echo "::error::$CCACHE_EXEC not found"; exit 1; }
        echo "prefix=ccache-${MANIFEST_BRANCH}-${DEVICE_NAME}-" >> "$GITHUB_OUTPUT"
        mkdir -p "$CCACHE_DIR"

    - name: Restore Ccache
      id: ccache-restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-prep.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ${{ steps.ccache-prep.outputs.prefix }}

    - name: Configure Ccache
      run: |
        ccache --set-config=max_size="$CCACHE_MAXSIZE"
        ccache --zero-stats
        echo "Restored: ${{ steps.ccache-restore.outputs.cache-matched-key || 'none (cold cache)' }}"

    - name: Build recovery
      id: build
      run: |
        cd ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        source ${{ env.DEVICE_PATH }}/vendorsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -eo pipefail
        lunch ${{ env.MAKEFILE_NAME }}-ap2a-eng
        mka adbd ${{ env.BUILD_TARGET }}image -j$(nproc --all) 2>&1 | tee ${{ steps.pwd.outputs.workspace-folder }}/build.log
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Report Ccache hit rate
      id: ccache-stats
      if: always() && steps.build.conclusion != 'skipped'
      run: |
        ccache --show-stats -v || true
        HITS=$(ccache --print-stats | awk -F'\t' '$1=="direct_cache_hit"||$1=="preprocessed_cache_hit"{s+=$2} END{print s+0}')
        MISS=$(ccache --print-stats | awk -F'\t' '$1=="cache_miss"{s+=$2} END{print s+0}')
        TOTAL=$((HITS + MISS))
        {
          echo "### ccache"
          echo "- hits: $HITS / misses: $MISS"
          [ "$TOTAL" -gt 0 ] && echo "- hit rate: $((100 * HITS / TOTAL))%"
          echo "- restored key: ${{ steps.ccache-restore.outputs.cache-matched-key || 'none (cold cache)' }}"
        } >> "$GITHUB_STEP_SUMMARY"
        if [ "$TOTAL" -eq 0 ]; then
          echo "::warning::ccache saw 0 compiler calls - Soong did not use it (check USE_CCACHE / CCACHE_EXEC)."
        fi
        echo "save=$([ "$MISS" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

    - name: Save Ccache
      id: ccache-save
      if: always() && steps.ccache-stats.outputs.save == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CCACHE_DIR }}
        key: ${{ steps.ccache-prep.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}

    - name: Prune old Ccache
      if: always() && steps.ccache-save.outcome == 'success'
      continue-on-error: true
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh cache list --repo "$GITHUB_REPOSITORY" --key "${{ steps.ccache-prep.outputs.prefix }}" \
          --sort created_at --order desc --limit 100 --json id --jq '.[1:][].id' \
          | while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY" || true; done

    - name: Check the output directory
      run: |
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/
        echo
        ls -al ${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/

    - name: Check module layout
      run: |
        set -e
        OUT=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}
        MODS=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/${{ env.DEVICE_PATH }}/prebuilt/modules

        src=$(ls "$MODS"/*.ko | wc -l)
        vnd=$(find "$OUT/vendor_ramdisk/lib/modules" -maxdepth 1 -name '*.ko' | wc -l)
        rec=$(find "$OUT/recovery/root/lib/modules" -maxdepth 1 -name '*.ko' | wc -l)
        echo "prebuilt: $src, vendor_ramdisk: $vnd, recovery root: $rec"
        [ "$vnd" -eq "$src" ] || { echo "::error::vendor_ramdisk has $vnd modules, expected $src"; exit 1; }
        [ "$rec" -eq 0 ] || { echo "::error::recovery fragment has $rec top-level modules"; exit 1; }

        { [ -e "$OUT/vendor_ramdisk/init" ] || [ -L "$OUT/vendor_ramdisk/init" ]; } || { echo "::error::$OUT/vendor_ramdisk/init missing (patch 03 not applied?)"; exit 1; }
        [ -f "$OUT/vendor_ramdisk/first_stage_ramdisk/fstab.mt6789" ] || { echo "::error::first-stage fstab missing from vendor_ramdisk"; exit 1; }

        cd "$MODS"
        unlisted=$(comm -13 <(sort -u modules.load modules.load.recovery) <(ls *.ko | sort) | wc -l)
        missing=$(comm -23 <(sort -u modules.load modules.load.recovery) <(ls *.ko | sort) | wc -l)
        [ "$unlisted" -eq 0 ] || { echo "::error::$unlisted modules are in no load list"; exit 1; }
        [ "$missing" -eq 0 ] || { echo "::error::$missing load-list entries have no module"; exit 1; }
        echo "load lists cover all $src modules"

    - name: Stage files and generate checksums
      run: |
        set -e
        OUT=${{ steps.pwd.outputs.workspace-folder }}/fox_${{ env.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}
        mkdir -p stage

        test -s "$OUT/vendor_boot.img" || { echo "::error::vendor_boot.img was not produced."; exit 1; }
        cp "$OUT/vendor_boot.img" stage/

        zips=("$OUT"/*.zip)
        [ "${#zips[@]}" -eq 1 ] && [ -f "${zips[0]}" ] || { echo "::error::expected exactly one .zip in $OUT, found ${#zips[@]}"; exit 1; }
        cp "${zips[0]}" stage/

        cd stage
        sha256sum -- * > SHA256SUMS.txt
        cat SHA256SUMS.txt
      working-directory: ${{ steps.pwd.outputs.workspace-folder }}

    - name: Upload vendor_boot image
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.pwd.outputs.workspace-folder }}/stage/vendor_boot.img
        archive: false
        if-no-files-found: error

    - name: Upload recovery zip
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.pwd.outputs.workspace-folder }}/stage/*.zip
        archive: false
        if-no-files-found: error

    - name: Upload checksums
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.pwd.outputs.workspace-folder }}/stage/SHA256SUMS.txt
        archive: false
        if-no-files-found: error

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: ${{ steps.pwd.outputs.workspace-folder }}/build.log
        archive: false
        if-no-files-found: ignore
